name: Build Linux Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyinstaller feedparser requests pandas openpyxl tqdm

      - name: Build executables
        run: |
          pyinstaller --onefile --name udid_daq_daily udid_daq_daily.py
          pyinstaller --onefile --name udid_daq_weekly udid_daq_weekly.py
          pyinstaller --onefile --name udid_daq_monthly udid_daq_monthly.py
          pyinstaller --onefile --name udid_daq_full udid_daq_full.py
          pyinstaller --onefile --name udid_daq_interactive udid_daq_interactive.py

      - name: Prepare Linux binaries
        run: |
          mkdir -p dist_linux
          cp dist/udid_daq_daily dist_linux/udid_daq_daily-linux-x64.bin
          cp dist/udid_daq_weekly dist_linux/udid_daq_weekly-linux-x64.bin
          cp dist/udid_daq_monthly dist_linux/udid_daq_monthly-linux-x64.bin
          cp dist/udid_daq_full dist_linux/udid_daq_full-linux-x64.bin
          cp dist/udid_daq_interactive dist_linux/udid_daq_interactive-linux-x64.bin
          chmod +x dist_linux/*

      - name: Upload to Release
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          artifacts: dist_linux/*
          artifactErrorsFailBuild: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}