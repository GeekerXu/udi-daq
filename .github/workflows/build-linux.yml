name: Build Linux Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyinstaller feedparser requests pandas openpyxl

      - name: Build executables
        run: |
          pyinstaller --onefile --name udid_daq_daily udid_daq_daily.py
          pyinstaller --onefile --name udid_daq_interactive udid_daq_interactive.py
          pyinstaller --onefile --name udid_daq_monthly udid_daq_monthly.py

      - name: Prepare binaries
        run: |
          mkdir -p dist_linux
          cp dist/udid_daq_interactive dist_linux/
          cp dist/udid_daq_daily dist_linux/
          cp dist/udid_daq_monthly dist_linux/
          chmod +x dist_linux/*

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist_linux/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
